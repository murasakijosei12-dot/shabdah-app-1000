  <style>
    /* Reader-specific styles */
    .reader-page {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    .reader-header {
      position: sticky;
      top: 0;
      z-index: 100;
      background: rgba(255,255,255,0.95);
      backdrop-filter: blur(12px);
      border-bottom: 1px solid var(--border);
      padding: 12px 20px;
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .reader-back {
      display: flex;
      align-items: center;
      gap: 8px;
      background: none;
      border: none;
      cursor: pointer;
      font-size: 14px;
      color: var(--ink-dim);
      padding: 8px 12px;
      border-radius: 8px;
      text-decoration: none;
    }
    .reader-back:hover {
      background: var(--bg);
      color: var(--teal-dark);
    }

    .reader-title {
      flex: 1;
      font-family: var(--font-display);
      font-size: 16px;
      font-weight: 600;
      color: var(--teal-dark);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .reader-actions {
      display: flex;
      gap: 8px;
    }

    .reader-btn {
      padding: 8px 14px;
      border: 1.5px solid var(--border);
      border-radius: 8px;
      background: var(--surface);
      font-size: 13px;
      font-weight: 600;
      color: var(--ink-dim);
      cursor: pointer;
    }
    .reader-btn:hover {
      border-color: var(--teal-lt);
      color: var(--teal-dark);
    }
    .reader-btn.active {
      background: var(--teal-dark);
      color: #fff;
      border-color: var(--teal-dark);
    }

    /* Input area */
    .reader-input-section {
      max-width: 720px;
      width: 100%;
      margin: 0 auto;
      padding: 40px 24px;
    }

    .reader-input-title {
      font-family: var(--font-display);
      font-size: 28px;
      font-weight: 600;
      color: var(--teal-dark);
      text-align: center;
      margin-bottom: 8px;
    }

    .reader-input-subtitle {
      font-size: 15px;
      color: var(--ink-muted);
      text-align: center;
      margin-bottom: 28px;
    }

    .reader-textarea {
      width: 100%;
      min-height: 200px;
      padding: 16px;
      font-family: 'Noto Sans JP', var(--font-ui);
      font-size: 16px;
      line-height: 1.8;
      color: var(--ink);
      border: 1.5px solid var(--border);
      border-radius: var(--radius);
      resize: vertical;
    }
    .reader-textarea:focus {
      outline: none;
      border-color: var(--teal-lt);
    }
    .reader-textarea::placeholder {
      color: var(--ink-muted);
    }

    .reader-start-btn {
      display: block;
      width: 100%;
      margin-top: 16px;
      padding: 14px;
      background: var(--teal-dark);
      color: #fff;
      border: none;
      border-radius: 10px;
      font-family: var(--font-ui);

      font-weight: 600;

    .reader-popup-actions {

      gap: 10px;

    .reader-popup-btn {
      flex: 1;
      padding: 12px;
      border-radius: 8px;
      font-family: var(--font-ui);
      font-size: 14px;
      font-weight: 600;

      background: var(--teal-dark);

      color: var(--teal-dark);
      border: 1.5px solid var(--border);

    /* Settings */

      position: fixed;
      top: 60px;
      right: 20px;
      z-index: 150;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 16px;
      box-shadow: var(--shadow-lg);

    .reader-settings.open {

    .reader-setting-row {

      align-items: center;
      justify-content: space-between;
      padding: 8px 0;
      font-size: 13px;
      color: var(--ink-dim);

    .reader-setting-row input[type="range"] {

    }

    /* Progress indicator */
    .reader-progress {
      position: fixed;
      top: 60px;
      left: 0;
      right: 0;
      height: 3px;
      background: var(--border);

    }
    .reader-progress-bar {
      height: 100%;
      background: var(--teal);

      transition: width 0.3s;
    }

    /* Loading state */
    .reader-loading {

    }

    /* Stats bar */
    .reader-stats {

      border-bottom: 1px solid var(--border);

    }
    .reader-stat {

    @media (max-width: 640px) {

        display: none;
      }

<div class="reader-page">

  <!-- Input section -->

    <textarea
      class="reader-textarea"
      id="reader-input"
      placeholder="Paste Japanese text here...

Example:
日本語を勉強しています。毎日新しい言葉を覚えています。"
    ></textarea>

    <button class="reader-start-btn" onclick="startReading()">Start Reading</button>

    <div class="reader-tips">

        <li><strong>Tap</strong> any word to see its definition</li>

      <button class="reader-popup-btn reader-popup-btn-primary" id="popup-add-btn" onclick="addToReview()">+ Add to Review</button>
    </div>

<script src="gen-dict.js?v=1"></script>
<script src="mobile-lookup.js?v=3"></script>
<script>
  // State
  let readerText = '';
  let lookupCount = 0;
  let addedCount = 0;
  let currentWord = null;
  let lastTapTime = 0;

  // Load saved text from localStorage
  document.addEventListener('DOMContentLoaded', () => {
    const saved = localStorage.getItem('ptw-reader-text');
    if (saved) {
      document.getElementById('reader-input').value = saved;
    }

    // Check dictionary status
    updateDictStatus();
  });

  function updateDictStatus() {
    const btn = document.getElementById('dict-status-btn');
    if (window.ptwMobileLookup && window.ptwMobileLookup.isLoaded()) {
      btn.textContent = 'Loaded';
      btn.classList.add('active');
    }
  }

  async function loadDictionary() {
    const btn = document.getElementById('dict-status-btn');
    if (window.ptwMobileLookup.isLoaded()) return;

    btn.textContent = 'Loading...';
    btn.disabled = true;

    try {
      await window.ptwMobileLookup.load((status) => {
        btn.textContent = status;
      });
      btn.textContent = 'Loaded';
      btn.classList.add('active');
    } catch (e) {
      btn.textContent = 'Error';
      console.error(e);
    }
    btn.disabled = false;
  }

  function startReading() {
    const input = document.getElementById('reader-input');
    const text = input.value.trim();

    if (!text) {
      alert('Please paste some Japanese text first');
      return;
    }

    // Save to localStorage
    localStorage.setItem('ptw-reader-text', text);
    readerText = text;

    // Process and display text
    displayText(text);

    // Show reading view
    document.getElementById('input-section').style.display = 'none';
    document.getElementById('reader-content').classList.add('active');
    document.getElementById('clear-btn').style.display = 'block';
    document.getElementById('reader-progress').style.display = 'block';

    // Update stats
    updateStats();
  }

  // Reader Mode's whole promise is "tap any word". This used to accumulate
  // every consecutive CJK/kana character into ONE span, breaking only at
  // punctuation and whitespace -- so a Japanese clause became a single
  // tappable blob and tapping it looked the entire clause up in JMdict, which
  // answered with whatever unrelated entry happened to match a fragment
  // (昨日は友達と公園で美味しいパンを食べました returned "と -- if; when").
  // mobile-lookup.js already exports a working segmenter; use it.
  const PARTICLES = new Set(['は','が','を','に','へ','で','と','も','や','か','ね','よ','の','さ','ば','ぞ','な','ん']);

  function displayText(text) {
    const container = document.getElementById('reader-text');
    const segments = (window.ptwMobileLookup && window.ptwMobileLookup.segment)
      ? window.ptwMobileLookup.segment(text)
      : [{ text, type: 'other' }];

    let html = '';
    for (let i = 0; i < segments.length; i++) {
      const seg = segments[i];
      if (seg.type === 'other') {
        html += seg.text === '\n' ? '<br>' : escapeHtml(seg.text);
        continue;
      }
      // A kanji run followed immediately by kana is nearly always one word
      // with its okurigana (食 + べました), and neither half is a dictionary
      // entry on its own. Offer the joined form as the lookup key; the popup
      // falls back to the run alone when the join isn't a real word, so
      // particles that merely follow a noun (公園 + で) still resolve.
      // Both halves of the join carry it, so tapping the okurigana tail of
      // 食べました answers 食べる rather than べた ("all over; solid"). A
      // single-kana run that is a common particle is excluded: は, と, で and
      // を are words in their own right, and inheriting the join backwards
      // turned 公園 + で into "図書館" and 今日 + は into "hello".
      let lookupKey = seg.text;
      const next = segments[i + 1];
      const prev = segments[i - 1];
      const isParticle = seg.text.length === 1 && PARTICLES.has(seg.text);
      if (seg.type === 'cjk' && next && next.type === 'hiragana') {
        lookupKey = seg.text + next.text;
      } else if (seg.type === 'hiragana' && prev && prev.type === 'cjk' && !isParticle) {
        lookupKey = prev.text + seg.text;
      }
      html += `<span class="reader-word" data-word="${escapeAttr(seg.text)}"`
            + (lookupKey !== seg.text ? ` data-join="${escapeAttr(lookupKey)}"` : '')
            + `>${escapeHtml(seg.text)}</span>`;
    }

    container.innerHTML = html;

    // Add click handlers
    container.querySelectorAll('.reader-word').forEach(el => {
      el.addEventListener('click', handleWordClick);
    });
  }

  function getCharType(char) {
    const code = char.charCodeAt(0);
    if (code >= 0x3041 && code <= 0x3096) return 'hiragana';
    if (code >= 0x30A1 && code <= 0x30F6) return 'katakana';
    if (code >= 0x4E00 && code <= 0x9FFF) return 'cjk';
    if (code >= 0x3400 && code <= 0x4DBF) return 'cjk';
    return 'other';
  }

  function handleWordClick(e) {
    const word = e.target.dataset.word;
    const now = Date.now();

    // Check for double-tap
    if (now - lastTapTime < 300 && currentWord === word) {
      addToReview();
      lastTapTime = 0;
      return;
    }

    lastTapTime = now;
    lookupWord(word, e.target);
  }

  async function lookupWord(word, element) {
    currentWord = word;

    // Clear previous selection
    document.querySelectorAll('.reader-word.selected').forEach(el => {
      el.classList.remove('selected');
    });
    element.classList.add('selected');

    // Show popup
    const popup = document.getElementById('word-popup');
    document.getElementById('popup-word').textContent = word;
    document.getElementById('popup-reading').textContent = '';
    document.getElementById('popup-gloss').textContent = 'Looking up...';

    popup.classList.add('open');
    lookupCount++;
    updateStats();

    // Try dictionary lookup
    if (window.ptwMobileLookup) {
      if (!window.ptwMobileLookup.isLoaded()) {
        document.getElementById('popup-gloss').innerHTML = `
          <div style="text-align: center;">
            <p>Dictionary not loaded</p>
            <button class="reader-btn" style="margin-top: 8px;" onclick="loadDictionaryAndRetryLookup('${escapeAttr(word)}')">
              Load Dictionary
            </button>
          </div>
        `;
        return;
      }

      // Prefer the kanji-run + okurigana join set up by displayText (食 +
      // べました -> 食べました, which deinflects to 食べる). Neither half is a
      // dictionary entry alone, but a particle that merely follows a noun
      // (公園 + で) produces no join hit, so the run itself still answers.
      const join = element.dataset.join;
      let results = join ? window.ptwMobileLookup.lookup(join) : [];
      let matched = join;
      if (!results.length) {
        results = window.ptwMobileLookup.lookup(word);
        matched = word;
      }
      if (results.length > 0) {
        const entry = results[0];
        document.getElementById('popup-word').textContent = entry.headword || matched;
        document.getElementById('popup-reading').textContent = entry.reading || '';
        const gloss = Array.isArray(entry.gloss) ? entry.gloss.join('; ') : entry.gloss;
        document.getElementById('popup-gloss').textContent = gloss || 'No definition found';
      } else {
        document.getElementById('popup-gloss').textContent = 'No definition found';
      }
    }
  }

  async function loadDictionaryAndRetryLookup(word) {
    document.getElementById('popup-gloss').textContent = 'Loading dictionary...';
    try {
      await window.ptwMobileLookup.load();
      const element = document.querySelector(`.reader-word[data-word="${word}"]`);
      if (element) lookupWord(word, element);
    } catch (e) {
      document.getElementById('popup-gloss').textContent = 'Failed to load dictionary';
    }
  }

  function closePopup() {
    document.getElementById('word-popup').classList.remove('open');
    document.querySelectorAll('.reader-word.selected').forEach(el => {
      el.classList.remove('selected');
    });
    currentWord = null;
  }

  function speakWord() {
    if (currentWord && 'speechSynthesis' in window) {
      const utterance = new SpeechSynthesisUtterance(currentWord);
      utterance.lang = 'ja-JP';
      utterance.rate = 0.9;
      speechSynthesis.speak(utterance);
    }
  }

  async function addToReview() {
    if (!currentWord) return;

    const btn = document.getElementById('popup-add-btn');

    // Check if user is logged in
    const user = await getCurrentUser();
    if (!user) {
      btn.textContent = 'Log in to save';
      btn.style.color = '#a87c1a';
      setTimeout(() => {
        btn.textContent = '+ Add to Review';
        btn.style.color = '';
      }, 2000);
      // Still save locally as fallback
      saveWordLocally(currentWord);
      return;
    }

    // Reader Mode is for Japanese text, so pair is JA_EN
    const pair = 'JA_EN';

    // Use the word itself as item_key for dictionary words
    // (not a curated concept, so no concept_id)
    const itemKey = currentWord;

    // Check if already in review via the SRS system
    if (typeof isInReview === 'function' && isInReview(itemKey, pair)) {
      btn.textContent = 'Already in deck';
      btn.style.color = '#1a7a4c';
      setTimeout(() => {
        btn.textContent = '+ Add to Review';
        btn.style.color = '';
      }, 1500);
      return;
    }

    btn.textContent = 'Adding...';
    btn.disabled = true;

    try {
      // Add to SRS via the progress table
      // For dictionary words: use item_key (the word), no concept_id
      const state = {
        ease_factor: 2.5,
        interval_days: 0,
        review_count: 0,
        next_review_date: new Date().toISOString().slice(0, 10),
        last_reviewed: new Date().toISOString()
      };

      // Save to Supabase progress table
      const { error } = await supabaseClient
        .from('progress')
        .upsert({
          user_id: user.id,
          item_key: itemKey,
          pair: pair,
          ...state
        }, { onConflict: 'user_id,pair,item_key' });

      if (error) throw error;

      // Mark the word as added in UI
      document.querySelectorAll(`.reader-word[data-word="${currentWord}"]`).forEach(el => {
        el.classList.add('added');
      });

      addedCount++;
      updateStats();

      btn.textContent = 'Added!';
      btn.style.color = '#1a7a4c';

    } catch (err) {
      console.warn('Failed to add to review (offline?):', err.message);
      // Save locally as fallback
      saveWordLocally(currentWord);
      btn.textContent = 'Saved locally';
      btn.style.color = '#a87c1a';
    }

    setTimeout(() => {
      btn.textContent = '+ Add to Review';
      btn.style.color = '';
      btn.disabled = false;
    }, 1500);
  }

  function saveWordLocally(word) {
    const added = JSON.parse(localStorage.getItem('ptw-reader-added') || '[]');
    if (!added.includes(word)) {
      added.push(word);
      localStorage.setItem('ptw-reader-added', JSON.stringify(added));
    }
    // Mark as added in UI
    document.querySelectorAll(`.reader-word[data-word="${word}"]`).forEach(el => {
      el.classList.add('added');
    });
    addedCount++;
    updateStats();
  }

  function updateStats() {
    const words = document.querySelectorAll('.reader-word').length;
    document.getElementById('stat-words').textContent = words;
    document.getElementById('stat-lookups').textContent = lookupCount;
    document.getElementById('stat-added').textContent = addedCount;
  }

  function clearReader() {
    if (confirm('Clear the current text?')) {
      localStorage.removeItem('ptw-reader-text');
      document.getElementById('reader-input').value = '';
      document.getElementById('reader-text').innerHTML = '';
      document.getElementById('input-section').style.display = 'block';
      document.getElementById('reader-content').classList.remove('active');
      document.getElementById('clear-btn').style.display = 'none';
      document.getElementById('reader-progress').style.display = 'none';
      closePopup();
      lookupCount = 0;
      addedCount = 0;
    }
  }

  function toggleSettings() {
    document.getElementById('settings-panel').classList.toggle('open');
  }

  function updateFontSize(size) {
    document.querySelector('.reader-text').style.fontSize = size + 'px';
    localStorage.setItem('ptw-reader-font-size', size);
  }

  function updateLineHeight(height) {
    document.querySelector('.reader-text').style.lineHeight = height;
    localStorage.setItem('ptw-reader-line-height', height);
  }

  // Update progress on scroll
  window.addEventListener('scroll', () => {
    const content = document.getElementById('reader-content');
    if (!content.classList.contains('active')) return;

    const scrollTop = window.scrollY;
    const docHeight = document.documentElement.scrollHeight - window.innerHeight;
    const progress = docHeight > 0 ? (scrollTop / docHeight) * 100 : 0;
    document.getElementById('progress-bar').style.width = progress + '%';
  });

  // Close popup on outside click
  document.addEventListener('click', (e) => {
    if (!e.target.closest('.reader-popup') && !e.target.closest('.reader-word')) {
      closePopup();
    }
    if (!e.target.closest('.reader-settings') && !e.target.closest('#settings-btn')) {
      document.getElementById('settings-panel').classList.remove('open');
    }
  });

  // Helpers
  function escapeHtml(str) {
    return String(str)
      .replace(/&/g, '&amp;')
      .replace(/</g, '&lt;')
      .replace(/>/g, '&gt;');
  }

  function escapeAttr(str) {
    return String(str)
      .replace(/&/g, '&amp;')
      .replace(/"/g, '&quot;')
      .replace(/'/g, '&#39;');
  }

  // Load saved settings
  const savedFontSize = localStorage.getItem('ptw-reader-font-size');
  const savedLineHeight = localStorage.getItem('ptw-reader-line-height');
  if (savedFontSize) {
    document.getElementById('font-size-slider').value = savedFontSize;
    document.querySelector('.reader-text').style.fontSize = savedFontSize + 'px';
  }
  if (savedLineHeight) {
    document.getElementById('line-height-slider').value = savedLineHeight;
    document.querySelector('.reader-text').style.lineHeight = savedLineHeight;
  }

  // Restore reading position if there was saved text
  window.addEventListener('load', () => {
    const saved = localStorage.getItem('ptw-reader-text');
    if (saved) {
      // Auto-start reading if there's saved text
      setTimeout(() => {
        const input = document.getElementById('reader-input');
        if (input.value === saved) {
          startReading();
        }
      }, 100);
    }
  });
</script>

</body>
</html>
